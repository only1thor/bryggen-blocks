<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4A6B8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bryggen Blocks</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="score-display">Score 0  ·  Lines 0</div>
    <div id="drop-zone"></div>
    <div id="controls-left">
      <button id="btn-left" class="ctrl-btn">←</button>
      <button id="btn-rotate-ccw" class="ctrl-btn">↺</button>
    </div>
    <div id="controls-right">
      <button id="btn-right" class="ctrl-btn">→</button>
      <button id="btn-rotate-cw" class="ctrl-btn">↻</button>
    </div>
  </div>
  <script src="frontend/js/constants.js"></script>
  <script src="engine/game.js"></script>
  <script src="frontend/js/renderer.js"></script>
  <script src="frontend/js/input.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
